<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#12213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Jar">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Smart%20Jar%22,%22short_name%22:%22Smart%20Jar%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%2312213D%22,%22theme_color%22:%22%2312213D%22}">
<title>Smart Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-dark:#12213D; --navy-mid:#1B3358; --navy-glow:#2A4A7C;
  --blue:#2E7BC4; --blue-deep:#1F5D9C; --blue-bg:#EAF2FB;
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#16233D; --gray:#6B7280; --mute:#9CA3AF;
  --rule:#E5E9EF; --fill:#F0F2F5; --fill2:#E8ECF0;
  --green:#16A34A; --green-bg:#E8F7EE; --green-line:#BCE8CC;
  --amber:#D97706; --amber-bg:#FDF1DF; --amber-line:#F3D9AE;
  --red:#DC2626; --red-bg:#FCE9E9; --red-line:#F5C6C6;
  --gray-bg:#EEF0F3; --gray-line:#DADFE5;
  --r-lg:20px; --r-md:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#DDE3EA; font-family:'Poppins',sans-serif; color:var(--ink);
  display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
}
.display{font-family:'Poppins',sans-serif}

@media (max-width:600px){
  body{ padding:0; background:var(--bg); min-height:100dvh; }
  .phone{
    width:100vw !important; height:100dvh !important; border-radius:0 !important;
    box-shadow:none !important;
  }
  .notch{ display:none; }
}

/* ---------- phone shell ---------- */
.phone{
  width:390px; height:820px; background:var(--bg); border-radius:44px;
  overflow:hidden; box-shadow:0 30px 60px -20px rgba(18,33,61,.45), 0 0 0 10px #0B1526;
  position:relative; display:flex; flex-direction:column;
}
.notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:150px; height:26px; background:#0B1526; border-radius:0 0 18px 18px; z-index:50;
}
.langtoggle{
  position:absolute; top:34px; right:20px; z-index:60; width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:'Poppins',sans-serif; font-size:10px; font-weight:700; letter-spacing:.01em;
}
.langtoggle:active{background:rgba(255,255,255,.2)}
.scroll{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ---------- header banner ---------- */
.banner{
  background:linear-gradient(160deg, var(--navy-mid) 0%, var(--navy-dark) 65%, #0E1A30 100%);
  padding:34px 20px 14px; color:#fff; position:relative; flex-shrink:0;
  min-height:112px; box-sizing:border-box;
}
.banner .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.banner h1{
  font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; letter-spacing:-.01em;
  display:flex; align-items:center; gap:7px; line-height:1.2;
}
.banner .status{
  display:flex; align-items:center; gap:6px; font-size:12px; color:#B9C7DE; margin-top:5px;
}
.dot{width:6px; height:6px; border-radius:50%; background:#3ECF77; flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(62,207,119,.22)}
.dot.off{background:#5A6B87; box-shadow:none}
.live-dot{width:10px; height:10px; border-radius:50%; background:var(--green); flex:0 0 auto;
  box-shadow:0 0 0 3px var(--green-bg)}
.backarrow{
  width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.1); color:#fff;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; margin-bottom:8px;
}
.backarrow:active{background:rgba(255,255,255,.2)}
.backarrow svg{width:16px; height:16px}
.backlink{
  display:flex; align-items:center; gap:6px; cursor:pointer; color:rgba(255,255,255,.75);
  position:relative; top:2px;
}
.backlink svg{width:19px; height:19px}
.backlink:active{color:#fff}
.titlerow{display:flex; align-items:center; gap:8px; margin-top:8px}
.titlerow h1{margin:0}

/* ---------- body ---------- */
.body{padding:16px; padding-bottom:28px}
.card{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg);
  padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(18,33,61,.04);
}
.card:last-child{margin-bottom:0}
.card h3{font-family:'Poppins',sans-serif; font-size:14.5px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:7px}
.card h3 svg{width:15px; height:15px}

.f{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--fill)}
.f:last-child{border-bottom:none; padding-bottom:0}
.f:first-child{padding-top:0}
.f .k{font-size:13px; color:var(--gray); display:flex; align-items:center; gap:6px}
.f .k svg{width:14px; height:14px; flex:0 0 auto}
.mt{font-size:12.5px; color:var(--gray); line-height:1.4; font-weight:400}
.f .v{font-size:13.5px; font-weight:600; text-align:right}
.f .v.mute{color:var(--mute); font-weight:400; font-size:12.5px}
.tagrow{display:flex; gap:5px; margin-top:2px; flex-wrap:wrap}

.chip{font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em}
.chip.live{background:var(--green-bg); color:var(--green); border:1px solid var(--green-line)}
.chip.low{background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-line)}
.chip.alert{background:var(--red-bg); color:var(--red); border:1px solid var(--red-line)}
.chip.offline{background:var(--gray-bg); color:var(--gray); border:1px solid var(--gray-line)}
.chip.off{background:var(--red-bg); color:var(--red); border:1px solid var(--red-line)}
.chip.manual{background:var(--gray-bg); color:var(--gray); border:1px solid var(--gray-line)}

.btn{
  display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  padding:13px; border-radius:14px; font-family:'Poppins',sans-serif; font-weight:600; font-size:14px;
  border:none; cursor:pointer; transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--blue) 0%, var(--blue-deep) 100%); color:#fff;
  box-shadow:0 8px 18px -6px rgba(46,123,196,.55)}
.btn.outline{background:#fff; border:1.5px solid var(--blue); color:var(--blue)}
.btn.outline.red{border-color:var(--red); color:var(--red)}
.btn.ghost{background:var(--fill); color:var(--gray); font-weight:500}
.btn.ghost-dark{background:rgba(255,255,255,.08); color:#fff; font-weight:500; border:1.5px solid rgba(255,255,255,.14)}
.btn.sm{padding:9px; font-size:12.5px; border-radius:11px}
.btn2{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.field{margin-bottom:12px}
.field label{display:block; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--mute); margin-bottom:6px}
.field input, .field select{
  width:100%; padding:12px 13px; border:1.5px solid var(--rule); border-radius:12px;
  font-family:'Poppins',sans-serif; font-size:14px; color:var(--ink); background:#fff;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--blue)}
.field.on-dark label{color:#9FB2CE}
.field.on-dark input{background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); color:#fff}
.field.on-dark input::placeholder{color:rgba(255,255,255,.42)}
.field.on-dark input:focus{border-color:rgba(255,255,255,.4)}
.hint{font-size:11.5px; color:var(--mute); line-height:1.5; margin:8px 0 14px}

.toggle{width:44px; height:26px; border-radius:20px; background:var(--gray-line); position:relative;
  cursor:pointer; flex:0 0 auto; transition:background .15s}
.toggle.on{background:var(--green)}
.toggle .knob{width:20px; height:20px; background:#fff; border-radius:50%; position:absolute; top:3px; left:3px;
  transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .knob{left:21px}

/* ---------- ring / hero ---------- */
.hero{
  background:linear-gradient(150deg, var(--navy-mid), var(--navy-dark));
  border-radius:var(--r-lg); padding:22px 16px 20px; text-align:center; color:#fff; margin-bottom:12px;
  position:relative; overflow:hidden;
}
.hero::before{content:'';position:absolute; inset:0;
  background:radial-gradient(circle at 20% 0%, rgba(46,123,196,.28), transparent 55%)}
.ring{width:150px; height:150px; border-radius:50%; margin:0 auto 14px; position:relative;
  display:flex; align-items:center; justify-content:center; z-index:1}
.ring .track{position:absolute; inset:0; border-radius:50%}
.ring .inner{width:112px; height:112px; background:#0F1D34; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ring .pct{font-family:'Poppins',sans-serif; font-size:29px; font-weight:800}
.ring .amt{font-size:11px; color:#B9C7DE; margin-top:2px}
.hero h2{font-family:'Poppins',sans-serif; font-size:19px; font-weight:700; position:relative; z-index:1}
.hero .sub{font-size:12px; color:#9FB2CE; margin-top:2px; position:relative; z-index:1}
.hero .chip{margin-top:10px; display:inline-block; position:relative; z-index:1}

/* ---------- lists ---------- */
.row-tap{cursor:pointer}
.jarrow{display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--fill)}
.jarrow .chip, .jarrow .live-dot{position:relative; top:1px}
.jarrow:last-child{border-bottom:none; padding-bottom:0}
.jarrow:first-child{padding-top:0}
.thumb{width:44px; height:44px; border-radius:12px; flex:0 0 auto; background:var(--fill);
  display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:19px}
.jarrow .info{flex:1; min-width:0}
.jarrow .nm{font-size:14.5px; font-weight:600; font-family:'Poppins',sans-serif}
.jarrow .mt{font-size:12px; color:var(--mute); margin-top:2px}
.jr-right{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.jr-pct{display:flex; align-items:center; gap:6px}
.jarrow .pctv{font-family:'Poppins',sans-serif; font-size:15px; font-weight:700; white-space:nowrap}
.jr-icons{display:flex; align-items:center; gap:6px}
.chev{color:var(--mute); font-size:16px; margin-left:2px}

.colrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
.colrow .nm{font-family:'Poppins',sans-serif; font-size:15px; font-weight:700}
.colrow .mt{font-size:12px; color:var(--mute); margin-top:2px}

/* ---------- alerts ---------- */
.seg{display:flex; background:var(--fill); border-radius:12px; padding:3px; margin-bottom:14px}
.seg div{flex:1; text-align:center; font-size:12.5px; font-weight:600; padding:8px 4px; border-radius:9px;
  color:var(--gray); cursor:pointer}
.seg div.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(18,33,61,.12)}
.al{display:flex; align-items:center; gap:10px}.al .aicon{width:34px; height:34px; border-radius:11px; background:var(--fill); color:var(--gray);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto}
.al .aicon.lo{background:var(--amber-bg); color:var(--amber)}
.al .txt{flex:1; min-width:0}
.al .ti{font-size:13.5px; font-weight:600; line-height:1.3}
.al .mt{font-size:11px; color:var(--mute); margin-top:2px}
.acts{display:flex; gap:6px; flex:0 0 auto}
.act{width:32px; height:32px; border-radius:10px; border:1.5px solid var(--rule); background:var(--fill2);
  color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer}
.act svg{width:16px; height:16px}
.act.ok{border-color:var(--green-line); background:var(--green-bg); color:var(--green)}
.act.rep{border-color:var(--amber-line); background:var(--amber-bg); color:var(--amber)}
.act:active{transform:scale(.92)}

/* ---------- collection accordion (Home) ---------- */
.viewswitch{display:flex; align-items:center; gap:7px; margin:2px 4px 12px; font-size:12px}
.viewswitch span{color:var(--mute); cursor:pointer; font-weight:500}
.viewswitch span.on{color:var(--ink); font-weight:700}
.viewswitch .vs-dot{color:var(--rule); cursor:default}
.col-card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg);
  margin-bottom:12px; overflow:hidden}
.col-head{display:flex; align-items:center; gap:11px; padding:16px; cursor:pointer}
.col-head .chip, .col-head .col-caret{position:relative; top:1px}
.col-head .nm{font-family:'Poppins',sans-serif; font-size:17px; font-weight:700}
.col-head .mt{font-size:12px; color:var(--mute); margin-top:2px}
.col-caret{color:var(--mute); flex:0 0 auto; transition:transform .2s; display:flex}
.col-caret.open{transform:rotate(180deg); color:var(--ink)}
.col-jars{padding:4px 16px 14px}
.jarlist{border-top:1px solid var(--fill)}
.jarlist .jarrow:last-child{border-bottom:none; padding-bottom:0}
.jarlist .jarrow:first-child{padding-top:12px}
.ghost-row{
  display:flex; align-items:center; justify-content:center; gap:7px; padding:12px;
  border:1.5px dashed var(--rule); border-radius:12px; color:var(--mute); font-size:13px; font-weight:600;
  cursor:pointer; margin-top:8px; background:transparent;
}
.ghost-row:active{background:var(--fill2)}
.pctpill{flex:1; text-align:center; padding:9px 2px; border-radius:10px; border:1.5px solid var(--rule);
  font-size:12.5px; font-weight:600; color:var(--gray); cursor:pointer}
.pctpill.on{border-color:var(--blue); background:var(--blue-bg); color:var(--blue)}

/* ---------- tabs ---------- */
.tabs{display:flex; background:#fff; border-top:1px solid var(--rule); flex-shrink:0;
  padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1; display:flex; align-items:center; justify-content:center; padding:8px 2px;
  cursor:pointer; color:var(--mute); position:relative}
.tab svg{width:21px; height:21px}
.tab.on{color:var(--blue)}
.badge{position:absolute; top:2px; right:calc(50% - 18px); background:var(--red); color:#fff;
  font-size:8.5px; font-weight:700; border-radius:8px; padding:1px 5px; min-width:15px; text-align:center}

.empty{text-align:center; padding:34px 10px}
.empty .ic{width:52px; height:52px; border-radius:16px; background:var(--blue-bg); color:var(--blue);
  display:flex; align-items:center; justify-content:center; margin:0 auto 14px}
.empty h4{font-family:'Poppins',sans-serif; font-size:16px; font-weight:700; margin-bottom:4px}
.empty p{font-size:12.5px; color:var(--gray); margin-bottom:16px; line-height:1.5}

.progress{height:7px; background:var(--fill); border-radius:6px; overflow:hidden; margin:2px 0}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--blue-deep)); border-radius:6px;
  transition:width .4s}

.stepdot{display:flex; gap:5px; margin-bottom:14px}
.stepdot div{flex:1; height:4px; border-radius:3px; background:var(--rule)}
.stepdot div.on{background:var(--blue)}

.toast{
  position:absolute; bottom:78px; left:16px; right:16px; background:var(--ink); color:#fff;
  padding:12px 15px; border-radius:12px; font-size:13px; font-weight:600; text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all .25s; z-index:80;
}
.toast.show{opacity:1; transform:translateY(0)}

/* ---------- modal ---------- */
.modal-overlay{
  position:absolute; inset:0; background:rgba(15,22,38,.55); z-index:90;
  display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-overlay.show{opacity:1; pointer-events:auto}
.modal-sheet{
  background:#fff; width:100%; border-radius:24px 24px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(24px); transition:transform .25s; max-height:88%; overflow-y:auto;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-grab{width:36px; height:4px; background:var(--rule); border-radius:3px; margin:0 auto 14px}
.modal-title{font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; margin-bottom:4px}
.modal-sub{font-size:12.5px; color:var(--gray); margin-bottom:16px; line-height:1.5}
.errtype{display:flex; gap:7px; margin-bottom:14px}
.errtype div{
  flex:1; text-align:center; padding:11px 4px; border-radius:12px; border:1.5px solid var(--rule);
  font-size:12.5px; font-weight:600; color:var(--gray); cursor:pointer;
}
.errtype div.on{border-color:var(--amber); background:var(--amber-bg); color:var(--amber)}
textarea{
  width:100%; padding:12px 13px; border:1.5px solid var(--rule); border-radius:12px;
  font-family:'Poppins',sans-serif; font-size:13.5px; color:var(--ink); resize:none; min-height:74px;
}
textarea:focus{outline:none; border-color:var(--blue)}
.ingredient-row{display:flex; gap:8px; margin-bottom:8px}
.ingredient-row input{flex:1}
.ingredient-row .rm{
  width:42px; height:42px; border-radius:11px; background:var(--red-bg); color:var(--red);
  border:1px solid var(--red-line); display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer;
}

/* ---------- BLE provisioning ---------- */
.stepbar{display:flex; align-items:center; margin-bottom:22px; padding:0 2px}
.stepbar .sb-node{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto}
.stepbar .sb-circle{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:700; background:var(--fill); color:var(--mute); border:2px solid var(--rule);
}
.stepbar .sb-circle.on{background:var(--navy-dark); color:#fff; border-color:var(--navy-dark)}
.stepbar .sb-circle.done{background:var(--green); color:#fff; border-color:var(--green)}
.stepbar .sb-lbl{font-size:10px; font-weight:600; color:var(--mute)}
.stepbar .sb-lbl.on{color:var(--ink)}
.stepbar .sb-line{flex:1; height:2px; background:var(--rule); margin:0 4px 18px}
.scan-target{
  width:190px; height:190px; border-radius:50%; margin:6px auto 20px; position:relative;
  background:radial-gradient(circle, #1B3358 0%, #0F1D34 70%);
  display:flex; align-items:center; justify-content:center;
}
.scan-target .pulse{
  position:absolute; inset:0; border-radius:50%; border:2px solid rgba(46,123,196,.4);
  animation:pulse 2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.7); opacity:.9}100%{transform:scale(1.18); opacity:0}}
.scan-target .center{color:#fff; z-index:2}
.foundrow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--fill)}
.foundrow:last-child{border-bottom:none}
.foundrow .fic{width:34px; height:34px; border-radius:10px; background:var(--green-bg); color:var(--green);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto}

/* ---------- trends / history ---------- */
.tl{margin-top:2px}
.tl-item{position:relative; padding-left:22px; padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute; left:2px; top:4px; width:9px; height:9px; border-radius:50%;
  background:var(--blue); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--rule)}
.tl-line{position:absolute; left:6px; top:15px; bottom:0; width:1px; background:var(--rule)}
.tl-item:last-child .tl-line{display:none}
.tl-time{font-size:11px; color:var(--mute); margin-bottom:3px}
.tl-val{font-family:'Poppins',sans-serif; font-size:16px; font-weight:700}
.tl-delta{font-size:12px; font-weight:600; margin-left:6px}
.tl-delta.up{color:var(--green)}
.tl-delta.down{color:var(--red)}
.tl-sub{font-size:12px; color:var(--gray); margin-top:2px}
.photo-block{width:100%; height:96px; border-radius:12px; margin-bottom:6px; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:30px}
.chartwrap{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg); padding:14px 12px 6px; margin-bottom:12px}
.chart-legend{display:flex; gap:14px; margin-top:2px; font-size:11.5px; color:var(--gray)}
.chart-legend span{display:inline-flex; align-items:center; gap:5px}

const HOUR = 3600*1000, DAY = 24*HOUR, NOW = Date.now();
function since(ts){
  const diff = NOW - ts;
  if(diff < HOUR) return Math.max(1,Math.round(diff/60000))+'m ago';
  if(diff < DAY) return Math.round(diff/HOUR)+'hr ago';
  const days = Math.round(diff/DAY);
  if(days < 7) return days+' day'+(days===1?'':'s')+' ago';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function relTime(s){
  if(state.lang!=='zh' || !s) return s;
  let m;
  if(s==='just now') return '刚刚';
  if(m = s.match(/^(\d+)m ago$/)) return m[1]+'分钟前';
  if(m = s.match(/^(\d+)hr? ago$/)) return m[1]+'小时前';
  if(m = s.match(/^(\d+) days? ago$/)) return m[1]+'天前';
  return s;
}

    'L5-001':'寿司米', 'M5-002':'燕麦', 'M5-003':'咖啡豆',
    'M5-004':'海盐', 'M5-005':'白扁豆', 'M5-006':'红芸豆'
  };
  return seed[j.id] || j.name;
}
function usageText(s){
  if(state.lang!=='zh' || !s || s==='-') return s;
  return s.replace('week','周');
}
function remainingText(j){

/* ---- deterministic mock history, so charts stay stable between renders ---- */
function seededRand(seed){ let s = seed % 233280; return () => { s = (s*9301+49297) % 233280; return s/233280; }; }
function buildJarHistory(j, seed){
  const rand = seededRand(1000 + seed*137);
  const weightHist = [];
  let w = (j.cap||400) * 0.55;
  for(let i=24; i>=0; i--){
    if(rand() < 0.08) w = Math.min(j.cap||400, w + (j.cap||400)*(0.3+rand()*0.5));
    else w = Math.max(0, w - rand()*6);
    weightHist.push({t: NOW - i*3*HOUR, v: Math.round(w*10)/10});
  }
  const envHist = [];
  let temp = 21 + rand()*3, hum = 40 + rand()*10;
  for(let i=24; i>=0; i--){
    temp += (rand()-0.5)*0.7; hum += (rand()-0.5)*2.2;
    envHist.push({t: NOW - i*3*HOUR, temp: Math.round(temp*100)/100, hum: Math.round(Math.max(20,Math.min(70,hum))*100)/100,
      batt: Math.max(20, (j.baseBatt||60) - Math.floor(i/4))});
  }
  const captureHist = [];
  for(let i=6; i>=0; i--){
    captureHist.push({t: NOW - i*5*HOUR, w:800, h:600, bytes: 140000 + Math.floor(rand()*160000)});
  }
  return {weightHist, envHist, captureHist};
}
function attachHistory(j, seed){ Object.assign(j, buildJarHistory(j, seed)); return j; }

/* ---- last-capture photo colour, standing in for a real photo ---- */
function jarPhotoColors(j){
  let h = 0; for(const c of j.name) h = (h*31 + c.charCodeAt(0)) % 360;
  return {a:`hsl(${h} 55% 30%)`, b:`hsl(${(h+40)%360} 60% 22%)`};
}
/* ---- placeholder photo, standing in for a real device capture ---- */
/* ---- food-keyword placeholder photo, standing in for a real device capture ---- */
function foodKeyword(name){
  const n = (name||'').toLowerCase();
  if(n.includes('sushi')||n.includes('rice')) return 'rice,grains,overhead';
  if(n.includes('oat')) return 'oats,overhead';
  if(n.includes('coffee')) return 'coffeebeans,overhead';
  if(n.includes('salt')) return 'seasalt,overhead';
  if(n.includes('lentil')) return 'lentils,overhead';
  if(n.includes('kidney')||n.includes('bean')) return 'kidneybeans,beans,overhead';
  if(n.includes('sugar')) return 'sugar,overhead';
  if(n.includes('spice')) return 'spices,overhead';
  return 'grains,pantry,overhead';
}
function hashSeed(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h%9999; }
function jarPhotoUrl(j, w, h, variant){
  const kw = foodKeyword(j.name);
  const seed = hashSeed((j.id||'')+'-'+(variant||'0'));
  return `https://loremflickr.com/${w||600}/${h||400}/${kw}?lock=${seed}`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove('show'), 1800);
}
function round5(n){ return Math.round(n/5)*5; }
function ringColor(pct){
  if(pct===null) return '#5A6B87';
  if(pct<25) return 'var(--amber)';
  if(pct<50) return '#F0B94A';
  return '#3ECF77';
}

let trendsTab = 'weight';
function lineChart(series, opts){
  opts = opts || {};
  const W=310, H=150, PL=40, PR=6, PT=8, PB=20;
  const allVals = series.flatMap(s=>s.data.map(d=>d.v));
  let min = Math.min(...allVals), max = Math.max(...allVals);
  if(min===max){min-=1; max+=1;}
  const pad = (max-min)*0.12; min-=pad; max+=pad;
  const n = series[0].data.length;
  const x = i => PL + (W-PL-PR) * (n<=1?0:i/(n-1));
  const y = v => PT + (H-PT-PB) * (1 - (v-min)/(max-min));
  const steps = [max, min+(max-min)*0.66, min+(max-min)*0.33, min];
  const grid = steps.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E9EF" stroke-width="1"/>
    <text x="${PL-6}" y="${y(v)+3}" font-size="9" fill="#9CA3AF" text-anchor="end" font-family="Poppins">${Math.round(v*10)/10}</text>`).join('');
  const paths = series.map(s=>{
    const pts = s.data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');
    const dots = s.data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="2" fill="${s.color}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');
  const tIdx = [0, Math.floor((n-1)/2), n-1];
  const xt = tIdx.map(i=>`<text x="${x(i)}" y="${H-4}" font-size="9" fill="#9CA3AF" text-anchor="middle" font-family="Poppins">${
    new Date(series[0].data[i].t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block">${grid}${paths}${xt}</svg>`;
}

function screenTrends(){
  const j = jars.find(x=>x.id===state.activeJar) || jars[0];
  return `
  <div class="banner">

function trendsWeight(j){
  const rows = [...j.weightHist].reverse();
  const items = rows.map((d,i)=>{
    const prev = rows[i+1];
    let delta = '';
    if(prev){
      const diff = Math.round((d.v-prev.v)*10)/10;
      if(diff>0) delta = `<span class="tl-delta up">↑ +${diff}g</span>`;
      else if(diff<0) delta = `<span class="tl-delta down">↓ ${diff}g</span>`;
    }
    return `<div class="tl-item"><div class="tl-dot"></div><div class="tl-line"></div>
      <div class="tl-time">${new Date(d.t).toLocaleTimeString('en-GB')}</div>
      <div class="tl-val">${d.v} g ${delta}</div></div>`;
  }).join('');
  return `
    <div class="chartwrap">
      <h3 style="margin-bottom:2px">${t('Weight trend')}</h3>
      ${lineChart([{color:'#1B7F5C', data:j.weightHist}])}
      <div class="chart-legend"><span><i style="background:#1B7F5C"></i>${t('Weight g')}</span></div>
    </div>
    <div class="card"><h3>${ic.clock} ${t('History detail')}</h3><div class="tl">${items}</div></div>`;
}

function trendsEnv(j){
  const rows = [...j.envHist].reverse();
  const items = rows.map(d=>`<div class="tl-item"><div class="tl-dot" style="background:#D97706"></div><div class="tl-line"></div>
      <div class="tl-time">${new Date(d.t).toLocaleTimeString('en-GB')}</div>
      <div class="tl-val">${d.temp}°C</div>
      <div class="tl-sub">${t('Humidity')} ${d.hum}% · ${t('Battery')} ${d.batt}%</div></div>`).join('');
  return `
    <div class="chartwrap">
      <h3 style="margin-bottom:2px">${t('Temperature / humidity trend')}</h3>
      ${lineChart([
        {color:'#1B7F5C', data:j.envHist.map(d=>({t:d.t, v:d.temp}))},
        {color:'#D97706', data:j.envHist.map(d=>({t:d.t, v:d.hum}))}

}

function trendsCaptures(j){

  const tabs = [

  document.getElementById('tabs').innerHTML = tabs.map(t=>`

  document.getElementById('app').innerHTML = screens[state.screen]();

}
